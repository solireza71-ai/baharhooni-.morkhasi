name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # امکان اجرای دستی از تب Actions

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::فایل app/google-services.json پیدا نشد. آن را از Firebase Console دانلود کنید و داخل پوشه app در GitHub آپلود کنید."
            exit 1
          fi
          if ! grep -q "com.baharhooni.morkhesi" app/google-services.json; then
            echo "::error::نام پکیج داخل google-services.json برابر com.baharhooni.morkhesi نیست. اپ اندروید را در Firebase با همین نام پکیج ثبت کنید."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MorkhesiBaharHooni-v1.5-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
